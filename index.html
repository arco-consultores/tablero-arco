  --lime:#5E9A00; --limeT:#3E7A00; --yelT:#8A6500; --up:#3E7A00; --down:#C2410C;
  --ig:#E5532D; --li:#1B8FC7; --l1:#7A5AE0; --l2:#0B9A85; --yt:#C98500; --sp:#5E9A00;
  --tipbg:#04452D; --tipfg:#FFFFFF; --f3:#04452D; --f3t:#FFFFFF;
  --up-bg:rgba(62,122,0,.16); --down-bg:rgba(194,65,12,.16); --yel-bg:rgba(138,101,0,.18);
  --ring1:rgba(161,219,35,.16); --ring2:rgba(255,200,7,.14); --shadow:0 8px 26px rgba(4,69,45,.16);
  --f-body:'Malgun Gothic Web','Malgun Gothic','Helvetica Neue',Arial,sans-serif;
  --f-tit:'Inter Tight','Helvetica Neue',Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-mode="light"]){
  --page:#082A1E; --pane:#04452D; --card:#06382A; --paper:#FFFFFF; --paperfg:#04452D;
  --ink:#FFFFFF; --ink2:rgba(255,255,255,.74); --ink3:rgba(255,255,255,.52); --line:rgba(255,255,255,.11); --track:rgba(255,255,255,.07);
  --lime:#A1DB23; --limeT:#A1DB23; --yelT:#FFC807; --up:#A1DB23; --down:#FF7A59;
  --ig:#FF7A59; --li:#5BC0EB; --l1:#B79CFF; --l2:#2EC4B6; --yt:#FFC807; --sp:#A1DB23;
  --tipbg:#FFFFFF; --tipfg:#04452D; --f3:#FFFFFF; --f3t:#04452D;
  --up-bg:rgba(161,219,35,.16); --down-bg:rgba(255,122,89,.16); --yel-bg:rgba(255,200,7,.18);
  --ring1:rgba(161,219,35,.08); --ring2:rgba(255,200,7,.07); --shadow:0 8px 26px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-mode="dark"]{
  --page:#082A1E; --pane:#04452D; --card:#06382A; --paper:#FFFFFF; --paperfg:#04452D;
  --ink:#FFFFFF; --ink2:rgba(255,255,255,.74); --ink3:rgba(255,255,255,.52); --line:rgba(255,255,255,.11); --track:rgba(255,255,255,.07);
  --lime:#A1DB23; --limeT:#A1DB23; --yelT:#FFC807; --up:#A1DB23; --down:#FF7A59;
  --ig:#FF7A59; --li:#5BC0EB; --l1:#B79CFF; --l2:#2EC4B6; --yt:#FFC807; --sp:#A1DB23;
  --tipbg:#FFFFFF; --tipfg:#04452D; --f3:#FFFFFF; --f3t:#04452D;
  --up-bg:rgba(161,219,35,.16); --down-bg:rgba(255,122,89,.16); --yel-bg:rgba(255,200,7,.18);
  --ring1:rgba(161,219,35,.08); --ring2:rgba(255,200,7,.07); --shadow:0 8px 26px rgba(0,0,0,.35); color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font-family:var(--f-body);line-height:1.5;-webkit-font-smoothing:antialiased;font-size:14px;
  padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));transition:background .3s}
button,input,select{font:inherit;color:inherit}
.app{position:relative;isolation:isolate;overflow:hidden;background:var(--pane);border-radius:30px;display:grid;grid-template-columns:232px minmax(0,1fr);grid-template-rows:1fr auto;min-height:calc(100vh - 48px);transition:grid-template-columns .35s cubic-bezier(.2,.7,.2,1),background .3s}
.app.rcol{grid-template-columns:76px minmax(0,1fr)}
.ring{position:absolute;border-radius:50%;pointer-events:none;z-index:-1}
.ring.r1{width:640px;height:640px;border:100px solid var(--ring1);left:-220px;bottom:6%}
.ring.r2{width:330px;height:330px;border:56px solid var(--ring2);right:12%;top:-120px}

/* riel */
.rail{position:relative;z-index:5;padding:26px 14px 22px 18px;display:flex;flex-direction:column;gap:22px;min-width:0}
.rhead{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:40px}
.logo{height:36px;width:auto;display:block}
.logo.d{display:none}
:root[data-mode="dark"] .logo.l{display:none}:root[data-mode="dark"] .logo.d{display:block}
@media (prefers-color-scheme:dark){:root:not([data-mode="light"]) .logo.l{display:none}:root:not([data-mode="light"]) .logo.d{display:block}}
.mlogo{display:none;width:40px;height:40px;border-radius:50%;box-shadow:0 0 0 2px var(--line)}
.rbtn{flex:none;width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink2);cursor:pointer;display:grid;place-items:center;transition:background .2s,color .2s,transform .3s}
.rbtn:hover{background:var(--card);color:var(--ink)}
.rbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .35s}
.app.rcol .rbtn svg{transform:rotate(180deg)}
@media(min-width:861px){
.app.rcol .rhead{flex-direction:column;gap:12px}
.app.rcol .logo{display:none!important}.app.rcol .mlogo{display:block}
.app.rcol .nav a{justify-content:center;padding:11px 0}
.app.rcol .nav a .t,.app.rcol .rail-foot{display:none}
.app.rcol .nav .dot{position:absolute;top:7px;right:12px;width:7px;height:7px}
.app.rcol .nav a:hover{transform:none}
.app.rcol .nav a:hover::after{content:attr(data-n);position:absolute;left:calc(100% + 12px);top:50%;transform:translateY(-50%);background:var(--tipbg);color:var(--tipfg);padding:6px 12px;border-radius:10px;font-size:12.5px;box-shadow:var(--shadow);z-index:20;pointer-events:none}
}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--ink2);text-decoration:none;font-weight:700;font-size:14px;transition:background .2s,color .2s,transform .2s;position:relative;white-space:nowrap}
.nav a svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav a:hover{background:var(--card);color:var(--ink);transform:translateX(3px)}
.nav a[aria-current="page"]{background:var(--yel);color:var(--deep)}
.nav .dot{margin-left:auto;width:8px;height:8px;border-radius:50%;background:var(--ink3);flex:none}
.nav .dot.ok{background:var(--lime)}.nav .dot.mid{background:var(--yel)}.nav .dot.no{background:var(--down)}
.rail-foot{margin-top:auto;font-size:12px;color:var(--ink3);line-height:1.45}
.rail-foot b{color:var(--ink2)}

/* cuerpo */
.main{padding:28px 36px 34px 18px;min-width:0}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 24px;margin-bottom:22px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--limeT);font-weight:700;margin-bottom:8px}
h1{margin:0;font-family:var(--f-tit);text-transform:uppercase;font-weight:300;line-height:1.14;font-size:clamp(26px,3.3vw,44px);text-wrap:balance}
h1 b{font-weight:700}
h1 mark{background:var(--yel);color:var(--deep);padding:.02em .16em .04em;border-radius:.14em;display:inline-block;line-height:1.04;font-weight:700}
.cmp{margin:10px 0 0;font-size:12.5px;color:var(--ink3)}
.cmp b{color:var(--ink2);font-weight:700}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px;position:relative}
.tb{display:inline-flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 15px;cursor:pointer;font-weight:700;font-size:13px;color:var(--ink);transition:border-color .2s,transform .2s,background .2s}
.tb:hover{border-color:var(--ink3);transform:translateY(-1px)}
.tb svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tb small{font-weight:400;color:var(--ink3);font-size:12.5px}
.tb.icon{padding:8px 10px}
.tb[aria-busy="true"]{opacity:.6;pointer-events:none}
:focus-visible{outline:2px solid var(--yel);outline-offset:2px}
.moon{display:none}.sun{display:block}
:root[data-mode="dark"] .moon{display:block}:root[data-mode="dark"] .sun{display:none}
@media (prefers-color-scheme:dark){:root:not([data-mode="light"]) .moon{display:block}:root:not([data-mode="light"]) .sun{display:none}}

/* desplegable de fechas */
.dd{position:absolute;right:0;top:calc(100% + 10px);width:min(360px,calc(100vw - 32px));background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);z-index:30;animation:rise .25s ease both}
.dd[hidden]{display:none}
.dd h4{margin:0 0 8px;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
.dd-sec+.dd-sec{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--ink2);transition:background .2s,color .2s,border-color .2s}
.chip:hover{border-color:var(--ink3);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--brand-lime);color:var(--deep);border-color:var(--brand-lime)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dd label{display:block;font-size:12px;color:var(--ink3)}
.dd select,.dd input[type=date]{width:100%;margin-top:4px;background:var(--pane);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--ink);font-size:13px}
.dd .err{margin:8px 0 0;font-size:12px;color:var(--down);min-height:16px}
.apply{margin-top:6px;width:100%;border:0;border-radius:10px;background:var(--brand-lime);color:var(--deep);font-weight:700;padding:10px;cursor:pointer;transition:background .2s}
.apply:hover{background:var(--yel)}

.grid{display:grid;gap:16px;grid-template-columns:repeat(12,minmax(0,1fr))}
.kgrid{grid-column:span 12;display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 22px;min-width:0;position:relative}
.card h3{margin:0 0 4px;font-size:15px;font-weight:700}
.card .sub{margin:0 0 14px;font-size:12.5px;color:var(--ink3)}
.hero .sub{max-width:none}
.kpi{container-type:inline-size}
@container (max-width:215px){.kpi .spark{display:none}.kpi .row .v{font-size:25px}.kpi .delta{font-size:11.5px;padding:3px 7px}}
.card .sub.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.how{margin:6px 0 0;font-size:11.5px;line-height:1.4;color:var(--ink3)}
.how.wn{color:var(--yelT)}
.mute{color:var(--ink3);font-size:12px;font-weight:400}
td.mute{text-align:center}
.mini small.mute{margin-left:4px}
.warn{display:block;margin:2px 0 0;padding:11px 14px;border-radius:12px;background:var(--yel-bg);color:var(--ink2);font-size:12.5px;line-height:1.45}
.warn b{color:var(--yelT)}
.warn.okc{background:var(--up-bg)}.warn.okc b{color:var(--up)}
.load{display:flex;align-items:center;gap:14px;padding:26px;color:var(--ink2)}
.load i{width:18px;height:18px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--yel);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise .6s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*60ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.kpi{display:flex;flex-direction:column;gap:6px;transition:transform .25s,border-color .25s}
.kpi:hover{transform:translateY(-3px);border-color:var(--ink3)}
.lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);font-weight:700;display:flex;align-items:center;gap:8px}
.lbl .sw{width:9px;height:9px;border-radius:50%;flex:none}
.vv{font-family:var(--f-tit);font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .v{white-space:nowrap;font-family:var(--f-tit);font-weight:700;font-size:clamp(26px,2.4vw,35px);line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .row{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;flex-wrap:wrap}
.delta{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:999px;font-variant-numeric:tabular-nums;white-space:nowrap}
.delta.up{background:var(--up-bg);color:var(--up)}
.delta.down{background:var(--down-bg);color:var(--down)}
.delta.flat{background:var(--track);color:var(--ink2)}
.kpi small{color:var(--ink3);font-size:12px}
.spark{display:block;flex:none}

.hero{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:26px;align-items:stretch}
.hero .big{font-family:var(--f-tit);font-weight:700;font-size:clamp(44px,6vw,84px);line-height:.98;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hero p{margin:10px 0 0;color:var(--ink2);font-size:13.5px;max-width:34ch}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0 0 10px;padding:0;list-style:none}
.legend li{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink2)}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.ax text{fill:var(--ink3);font-size:11px;font-family:var(--f-body)}
.ax line{stroke:var(--line)}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.fade{animation:fadein .8s .5s both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--tipbg);color:var(--tipfg);border-radius:12px;padding:9px 12px;font-size:12.5px;box-shadow:var(--shadow);opacity:0;transition:opacity .12s;max-width:240px}
#tip.on{opacity:1}
#tip b{display:block;margin-bottom:3px;font-size:12px;opacity:.75}
#tip div{display:flex;align-items:center;gap:7px;line-height:1.5}
#tip i{width:9px;height:9px;border-radius:50%;flex:none}
#tip span{margin-left:auto;font-weight:700;padding-left:12px;font-variant-numeric:tabular-nums}

.bars{display:flex;flex-direction:column;gap:11px}
.bar{display:grid;grid-template-columns:minmax(80px,132px) minmax(0,1fr) auto;gap:12px;align-items:center;font-size:13px}
.bar .nm{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tr{height:12px;background:var(--track);border-radius:999px;overflow:hidden}
.bar .fl{display:block;height:100%;width:0;border-radius:999px;transition:width .9s cubic-bezier(.2,.7,.2,1)}
.bar .vl{font-weight:700;font-variant-numeric:tabular-nums;min-width:48px;text-align:right}
.bar:hover .nm{color:var(--ink)}

.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);text-align:left;font-weight:700;padding:0 10px 10px}
td{padding:11px 10px;border-top:1px solid var(--line);font-size:13px;vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:hover td{background:var(--track)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--track);color:var(--ink2);white-space:nowrap}
.mini{display:flex;align-items:center;gap:8px}
.mini .tr{flex:1;min-width:60px;height:8px;border-radius:999px;background:var(--track);overflow:hidden}
.mini .fl{display:block;height:100%;border-radius:999px;width:0;transition:width .9s cubic-bezier(.2,.7,.2,1)}
.ttl{max-width:300px;line-height:1.3}
.ttl a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line)}
.ttl a:hover{border-color:var(--ink2)}
.lk{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);color:var(--ink2);transition:background .2s,color .2s,transform .2s}
.lk:hover{background:var(--yel);color:var(--deep);border-color:var(--yel);transform:translateY(-2px)}
.lk svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* burbujas por formato: una columna por formato, burbuja arriba y lectura debajo */
.bcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:26px 22px;align-items:end;padding:6px 0 4px}
.bcol{display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center}
.bwrap{display:grid;place-items:center;width:100%}
.bub{width:var(--d);height:var(--d);border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;
  background:var(--cs);border:2px solid var(--c);cursor:default;
  animation:pop .8s cubic-bezier(.2,1.4,.4,1) both,bob 5s ease-in-out infinite alternate;animation-delay:calc(var(--i)*.14s),calc(.8s + var(--i)*.3s);transition:background .25s,transform .25s}
.bub:hover{background:var(--cs2);animation-play-state:running,paused;transform:translateY(-6px) scale(1.05)}
.bub.top{background:var(--cs2)}
.bub b{font-family:var(--f-tit);font-size:clamp(20px,2vw,28px);line-height:1.05;font-variant-numeric:tabular-nums}
.bname{font-weight:700;font-size:14px}
.bsub{font-size:12px;color:var(--ink3)}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes bob{from{translate:0 0}to{translate:0 -7px}}

/* dona */
.donut{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;justify-items:center}
.donut svg{width:100%;max-width:230px;display:block;margin:0 auto;overflow:visible}
.seg{fill:none;stroke-width:34;transform-origin:110px 110px;transform:rotate(var(--rot));cursor:default;transition:transform .25s,stroke-width .25s;animation:sweep 1s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i)*.18s)}
.seg:hover{stroke-width:42}
@keyframes sweep{from{stroke-dasharray:0 999}}
.dlg{display:flex;flex-direction:column;gap:10px;width:100%;max-width:300px}
.dlg div{display:flex;align-items:center;gap:10px;font-size:13px;white-space:nowrap}
.dlg i{width:11px;height:11px;border-radius:50%;flex:none}
.dlg b{margin-left:auto;white-space:nowrap;font-family:var(--f-tit);font-size:18px;font-variant-numeric:tabular-nums}
.dctr{font-family:var(--f-tit);fill:var(--ink);text-anchor:middle}

/* embudo */
.funnel svg{display:block;width:100%;overflow:visible}
.fst{transform-origin:50% 0;animation:fgrow .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*.2s);transition:transform .25s,filter .25s;transform-box:fill-box}
.fst:hover{transform:translateY(-3px);filter:brightness(1.07)}
@keyframes fgrow{from{opacity:0;transform:scaleY(.2) scaleX(.9)}to{opacity:1;transform:none}}
.ftx{animation:fadein .6s both;animation-delay:calc(var(--i)*.2s + .4s);pointer-events:none}
.fcv{font-size:13.5px;fill:var(--ink3);text-anchor:middle}
.fcv tspan.hl{fill:var(--limeT);font-weight:700}
.fnote{margin:10px 0 0;font-size:12px;color:var(--ink3)}

/* insight tarjeta */
.ins{background:var(--paper);color:var(--paperfg);border-top:7px solid var(--yel);border-radius:18px;padding:20px 24px;border-left:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.ins .k{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:#4A5F45;margin-bottom:6px}
.ins h3{margin:0 0 8px;font-family:var(--f-tit);font-size:clamp(20px,2.1vw,28px);line-height:1.18;color:var(--paperfg);font-weight:700;text-wrap:balance}
.ins p{margin:0;color:#34493a;font-size:14px;max-width:70ch}
.src{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:13px}
.src:first-of-type{border-top:0;padding-top:0}
.src .nm{font-weight:700;min-width:0;flex:1}
.src .nm small{display:block;font-weight:400;color:var(--ink3);font-size:12px}
.st2{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.st2.ok{background:var(--up-bg);color:var(--up)}
.st2.mid{background:var(--yel-bg);color:var(--yelT)}
.st2.no{background:var(--down-bg);color:var(--down)}

<style>/* ===== efectos al pasar el puntero ===== */

.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .35s;background:radial-gradient(240px circle at var(--gx,50%) var(--gy,50%),rgba(161,219,35,.2),transparent 70%)}

  er.textContent='';apply(a,b,'Rango personalizado','custom');closeDD()});
function openDD(){dd.hidden=false;ddb.setAttribute('aria-expanded','true')}
function closeDD(){dd.hidden=true;ddb.setAttribute('aria-expanded','false')}
ddb.addEventListener('click',e=>{e.stopPropagation();dd.hidden?openDD():closeDD()});
document.addEventListener('click',e=>{if(!dd.hidden&&!dd.contains(e.target)&&e.target!==ddb)closeDD()});
addEventListener('keydown',e=>{if(e.key==='Escape')closeDD()});

/* ---- PDF ---- */
function inlineSvgStyles(doc){const props=['fill','fill-opacity','stroke','stroke-width','stroke-dasharray','stroke-dashoffset','stroke-linecap','stroke-linejoin','opacity','font-size','font-family','font-weight','text-anchor','transform','transform-origin'];
  doc.querySelectorAll('svg *').forEach(n=>{const cs=doc.defaultView.getComputedStyle(n);props.forEach(p=>{const v=cs.getPropertyValue(p);if(v&&v!=='none'&&v!=='normal'||p==='fill'||p==='stroke')n.style.setProperty(p,v)})})}
async function exportPDF(){
  const b=$('#pdf'),t=$('#pdft');
  if(typeof html2canvas==='undefined'||!(window.jspdf&&window.jspdf.jsPDF)){toast('No se pudo cargar el generador de PDF. Revisa la conexión e intenta de nuevo.');return}
  b.setAttribute('aria-busy','true');t.textContent='Generando…';closeDD();hideTip();
  const y0=window.scrollY;window.scrollTo(0,0);root.classList.add('printing');finishCounters(view);
  document.querySelectorAll('.mini .fl').forEach(f=>f.style.width=f.dataset.w+'%');
  const lg=effMode()==='dark'?$('.logo.d').src:$('.logo.l').src,bg=getComputedStyle(app).backgroundColor,fil=`${RSEL.label}, del ${fL(S)} al ${fL(E)}${HAS_PREV?`. Comparado con ${fL(S-L)} al ${fL(S-1)}`:''}`;
  try{await new Promise(r=>setTimeout(r,350));
    const cv2=await html2canvas($('#main'),{scale:2,backgroundColor:bg,useCORS:true,logging:false,onclone:doc=>{
      doc.documentElement.classList.add('printing');inlineSvgStyles(doc);
      doc.querySelectorAll('.tools,.tools-r').forEach(t=>t.style.display='none');
      doc.querySelectorAll('details').forEach(d=>d.open=true);
      const h=doc.createElement('div');h.style.cssText='display:flex;align-items:center;justify-content:space-between;margin:0 0 22px;gap:16px';h.innerHTML=`<img src="${lg}" style="height:34px"><div style="font-size:12px;opacity:.7;text-align:right;max-width:60%">Tablero de redes ARCO<br>Filtro: ${fil}</div>`;
      const m=doc.querySelector('#main');m.insertBefore(h,m.firstChild);m.style.padding='28px 36px 34px';}});
    const w=cv2.width/2,h2=cv2.height/2,pdf=new window.jspdf.jsPDF({orientation:w>h2?'l':'p',unit:'px',format:[w,h2],hotfixes:['px_scaling']});
    pdf.addImage(cv2.toDataURL('image/jpeg',.92),'JPEG',0,0,w,h2);
    const nm=`ARCO_${VIEWS.find(x=>x.id===current).n}_${iso(S)}_${iso(E)}.pdf`;pdf.save(nm);toast('PDF generado: '+nm)}
  catch(err){console.error(err);toast('No se pudo generar el PDF.')}
  finally{root.classList.remove('printing');window.scrollTo(0,y0);b.removeAttribute('aria-busy');t.textContent='Descargar PDF'}}
$('#pdf').addEventListener('click',exportPDF);

/* ============ Arranque ============ */
function initUI(){
  const st=(n)=>n?'ok':'no';
  const stat={resumen:'ok',instagram:st(P.ig.length),linkedin:st(P.li.length),lideres:P.ana.length&&P.pab.length?'ok':(P.ana.length||P.pab.length?'mid':'no'),youtube:st(P.yt.length),spotify:st(P.sp.length),leads:LD.landing.length&&LD.quiz.length?'ok':(LD.landing.length||LD.quiz.length?'mid':'no'),insights:'ok'};
  $('#nav').innerHTML=VIEWS.map(v=>`<a href="#${v.id}" data-v="${v.id}" data-n="${v.n}">${ICON[v.id]}<span class="t">${v.n}</span><i class="dot ${stat[v.id]}" title="${{ok:'Con datos',mid:'Datos parciales',no:'Sin datos todavía'}[stat[v.id]]}"></i></a>`).join('');
  $('#rfoot').innerHTML=LIVE?`<b>Fuente: Google Sheets.</b><br>Actualizado el ${fG(RAW.generado)}. El punto verde indica que la red tiene datos.<br>Puente: ${esc((RAW.meta&&RAW.meta.version)||'versión anterior')}`:'<b>Datos de ejemplo.</b><br>Con la URL del Apps Script se conecta al Sheet y los puntos verdes indican qué redes tienen datos.';
  $('#chips').innerHTML=PRESETS.map(p=>`<button class="chip" data-k="${p[0]}" aria-pressed="false">${p[1]}</button>`).join('');
  const y0=START.getFullYear(),y1=TODAY.getFullYear();$('#selY').innerHTML='<option value="">Elegir</option>'+Array.from({length:y1-y0+1},(_,i)=>`<option value="${y0+i}">${y0+i}</option>`).join('');
  $('#selM').innerHTML='<option value="">Todo el año</option>'+MESES.map((m,i)=>`<option value="${i}">${m[0].toUpperCase()+m.slice(1)}</option>`).join('');
  $('#dFrom').min=$('#dTo').min=iso(0);$('#dFrom').max=$('#dTo').max=iso(N-1);fxScan()}
function setDefaultRange(){const p=PRESETS.find(x=>x[0]==='1m'),r=p[2]();setRange(r[0],r[1],p[1],'1m')}
function start(raw){load(raw);initUI();setDefaultRange();syncDD();READY=true;route()}
function showErr(e){READY=false;view.innerHTML=`<div class="card" style="padding:28px"><h3>No se pudieron leer los datos del Google Sheet</h3><p class="sub">${esc(e&&e.message||e)}</p><p style="color:var(--ink2);font-size:13.5px;margin:0 0 16px">Revisa que la aplicación web de Apps Script esté publicada con acceso para cualquier persona y que la URL de DATA_URL termine en /exec.</p><button class="apply" style="width:auto;padding:10px 20px" onclick="boot()">Reintentar</button></div>`}
/* actualizar sin recargar la pagina: mantiene la pantalla y el rango de fechas */
async function refresh(){const b=$('#rl');if(!READY||b.getAttribute('aria-busy')==='true')return;b.setAttribute('aria-busy','true');
  const sp=splash({fast:true}),dataP=getData(true);dataP.catch(()=>{});let err=null;
  try{await sp.fill(dataP);
    const raw=await dataP,key=RSEL.key,label=RSEL.label,f=dateAt(S),t=dateAt(E);load(raw);initUI();
    const p=PRESETS.find(x=>x[0]===key),r=p?p[2]():[idxOf(f),idxOf(t)];setRange(r[0],r[1],label,key);syncDD();render()}
  catch(e){err=e;await sp.fill(Promise.resolve())}
  await sp.reveal();b.removeAttribute('aria-busy');
  toast(err?'No se pudo actualizar: '+(err.message||err):(LIVE?`Datos actualizados desde el Google Sheet (${fG(RAW.generado)})`:'Datos de ejemplo recargados'))}
$('#rl').addEventListener('click',refresh);
async function getData(fresh){
  if(!DATA_URL)return FIXTURE;
  const q=[DATA_KEY?'k='+encodeURIComponent(DATA_KEY):'',fresh?'fresco=1':''].filter(Boolean).join('&');
  const r=await fetch(DATA_URL+(q?(DATA_URL.includes('?')?'&':'?')+q:''));if(!r.ok)throw new Error('El servidor respondió '+r.status);const j=await r.json();if(j.error)throw new Error(j.error);LIVE=true;return j}
async function boot(){
  const sp=splash(),dataP=getData();dataP.catch(()=>{});
  await sp.fill(dataP);
  try{start(await dataP)}catch(e){showErr(e)}
  await sp.reveal()}
boot();
</script>
